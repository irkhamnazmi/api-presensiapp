<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RetroWave Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="onboarding_theme.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.0.0/dist/flowbite.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--background)] font-sans text-[var(--foreground)] relative overflow-hidden">
  <div class="crt-effect"></div>
  
  <!-- Main Content -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col justify-center p-6 relative">
    <!-- Progress Steps -->
    <div class="flex justify-center mb-8 space-x-2">
      <div class="w-3 h-3 rounded-full bg-[var(--primary)]"></div>
      <div class="w-3 h-3 rounded-full bg-[var(--muted)]"></div>
      <div class="w-3 h-3 rounded-full bg-[var(--muted)]"></div>
    </div>

    <!-- Carousel -->
    <div class="carousel relative overflow-hidden rounded-2xl border-2 border-[var(--border)]">
      <!-- Slide 1 -->
      <div class="carousel-item w-full flex flex-col items-center p-8">
        <div class="w-48 h-48 bg-gradient-to-br from-[var(--primary)] to-[var(--secondary)] rounded-full mb-8 animate-pulse"></div>
        <h2 class="text-3xl font-bold mb-4 text-[var(--primary)]">Welcome to the Grid</h2>
        <p class="text-center text-[var(--muted)] mb-8">Prepare to experience digital innovation in its purest retro form</p>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex justify-between items-center mt-8">
      <button class="px-6 py-2 rounded-lg border-2 border-[var(--border)] hover:bg-[var(--muted)] transition-colors">
        Skip
      </button>
      <button class="px-6 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] hover:bg-[var(--ring)] transition-colors flex items-center gap-2">
        Next
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
